name: mosquito-wingbeat

services:
  api:
    build: .
    image: mosquito-wingbeat-api:latest
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RETRAIN_EPOCHS: ${RETRAIN_EPOCHS:-5}
    expose:
      - "8000"
    volumes:
      - app_storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_storage:
